plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version "${spotless_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
		content { includeGroup 'com.terraformersmc' }
	}
}

loom {
	accessWidenerPath = file("src/main/resources/applefix.classtweaker")

	// Mod Menu (dev runtime only) bundles Fabric API modules whose class tweakers inject interfaces
	// into Minecraft classes; the mod does not depend on them, so it must compile without them.
	enableTransitiveAccessWideners = false
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Optional at runtime ("recommends" in fabric.mod.json): adds a "Configure" button.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// fabric-loader-junit runs tests on the Knot class loader, so mixin targets are transformed.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = "UTF-8"
	options.compilerArgs.addAll(["-Xlint:all,-processing,-classfile,-serial", "-Werror"])
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

spotless {
	java {
		target "src/*/java/**/*.java"
		// 1.36.1: newest version compatible with Spotless 8.10.4 (1.37.0 fails with NoSuchMethodError).
		googleJavaFormat("1.36.1")
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
